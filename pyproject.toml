[project]
name = "moselecta"
version = "0.3.0"
description = "CDS-structure-aware gene-model selection with optional genomic sequence, protein, and transcript evidence integration"
readme = "README.md"
requires-python = ">=3.10,<3.16"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "David Swarbreck", email = "David.Swarbreck@earlham.ac.uk" },
  { name = "Gemy Kaithakottil", email = "Gemy.Kaithakottil@earlham.ac.uk" }
]
dependencies = []
keywords = ["annotation", "GFF3", "gene models", "CDS", "genome annotation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.scripts]
moselecta = "moselecta.cli:main"
moselecta-compare = "moselecta.compare:main"

[build-system]
requires = ["uv_build>=0.8.0,<1.0.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-include = [
  ".github/**",
  "CITATION.cff",
  "CHANGELOG.md",
  "INSTALLATION.md",
  "docs/**",
  "examples/**",
  "tests/**",
  "Dockerfile",
  "uv.lock",
]
source-exclude = [
  "/dist",
  "/.git",
  "/.venv",
  "/.pytest_cache",
  "/.ruff_cache",
  "**/.DS_Store",
  "/examples/bombus_4mb/inputs",
  "/examples/bombus_4mb/outputs",
]

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "ruff>=0.14,<1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# Keep the release gate intentionally narrow: definite Python errors and
# exception-chain loss. Broader style/complexity cleanup is tracked separately.
select = ["E9", "F", "B904"]
