name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # os: [ubuntu-latest, macos-latest, windows-latest]
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test tools and package
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pytest>=8,<9" "ruff>=0.14,<1"
          python -m pip install -e .
      - name: Static checks
        run: |
          ruff check src tests examples/scripts
          python -m compileall -q src tests examples/scripts
      - name: Full tests
        run: pytest -q
      - name: Installed CLI fixture
        run: |
          mkdir -p ci-output
          moselecta --version
          moselecta --help >/dev/null
          moselecta --inputs tests/data/alternative_splice_smoke_a.gff3 tests/data/alternative_splice_smoke_b.gff3 --source-name predictor_a predictor_b --output-profile minimal --progress-log-level none --out-prefix ci-output/example
          python examples/scripts/validate_gff3.py ci-output/example.final_annotation.gff3

  # The wheel is pure Python (py3-none-any), so it is built and checked once
  # on Linux; the test job above installs and runs the package on every OS.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build --outdir dist
      - name: Verify artifact contents
        run: |
          python -m zipfile -l dist/*.whl
          tar -tzf dist/*.tar.gz
          if python -m zipfile -l dist/*.whl | grep -E '(__pycache__|\.pyc|\.DS_Store|Bombus|analysis/)'; then exit 1; fi
      - name: Install wheel and sdist separately
        run: |
          python -m venv /tmp/moselecta-wheel
          /tmp/moselecta-wheel/bin/python -m pip install dist/*.whl
          /tmp/moselecta-wheel/bin/moselecta --version
          python -m venv /tmp/moselecta-sdist
          /tmp/moselecta-sdist/bin/python -m pip install dist/*.tar.gz
          /tmp/moselecta-sdist/bin/moselecta --version
      - uses: actions/upload-artifact@v7
        with:
          name: moselecta-dist
          path: dist/*
